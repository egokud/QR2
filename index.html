<!DOCTYPE html>

<meta charset="UTF-8">

<title>Сканер посылок</title>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; min-height: 100vh; }

  .header { background: #fff; border-bottom: 1px solid #e0e0e0; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; }
  .header h1 { font-size: 18px; font-weight: 600; color: #1a1a1a; }
  .btn-export { background: none; border: 1px solid #e0e0e0; border-radius: 8px; font-size: 13px; cursor: pointer; padding: 6px 12px; color: #555; }

  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 16px; }
  .stat-card { background: #fff; border-radius: 10px; padding: 14px; border: 1px solid #e0e0e0; text-align: center; }
  .stat-num { font-size: 26px; font-weight: 700; color: #7c6ff7; }
  .stat-label { font-size: 12px; color: #999; margin-top: 2px; }

  .progress-wrap { margin: 0 16px 16px; background: #e0e0e0; border-radius: 10px; overflow: hidden; height: 8px; }
  .progress-bar { height: 100%; background: #7c6ff7; transition: width 0.4s; }

  .scanner-section { margin: 16px; }
  #reader { border-radius: 12px; overflow: hidden; background: #000; max-height: 220px; }
  #reader video { width: 100% !important; border-radius: 12px; object-fit: cover; height: 220px; }

  .btn-scan { display: block; width: 100%; background: #7c6ff7; color: #fff; border: none; border-radius: 12px; padding: 16px; font-size: 16px; font-weight: 600; cursor: pointer; margin-bottom: 0; }
  .btn-scan:active { transform: scale(0.98); }
  .btn-scan.stop { background: #f0f0f0; color: #555; }

  .manual-section { background: #fff; margin: 16px; border-radius: 12px; padding: 16px; border: 1px solid #e0e0e0; }
  .manual-section h3 { font-size: 12px; color: #999; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; }
  .manual-row { display: flex; gap: 8px; }
  .manual-row input { flex: 1; border: 1px solid #e0e0e0; border-radius: 8px; padding: 10px 12px; font-size: 14px; color: #1a1a1a; outline: none; min-width: 0; }
  .manual-row input:focus { border-color: #7c6ff7; }
  .manual-row button { background: #7c6ff7; color: #fff; border: none; border-radius: 8px; padding: 10px 16px; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; }

  .result-card { margin: 0 16px 16px; border-radius: 12px; padding: 20px; border: 1.5px solid; }
  .result-card.success { background: #f0fdf4; border-color: #86efac; }
  .result-card.error { background: #fef2f2; border-color: #fca5a5; }
  .result-card.already { background: #fffbeb; border-color: #fcd34d; }
  .result-label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
  .result-card.success .result-label { color: #16a34a; }
  .result-card.error .result-label { color: #dc2626; }
  .result-card.already .result-label { color: #d97706; }
  .result-track { font-size: 13px; color: #888; margin-bottom: 10px; word-break: break-all; }
  .result-warehouse { font-size: 32px; font-weight: 700; color: #1a1a1a; }
  .result-message { font-size: 14px; color: #555; line-height: 1.5; }

  .history { margin: 0 16px 16px; }
  .history-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .history-header h3 { font-size: 12px; color: #999; text-transform: uppercase; letter-spacing: 0.5px; }
  .history-header button { font-size: 12px; color: #dc2626; background: none; border: none; cursor: pointer; }
  .history-item { background: #fff; border-radius: 8px; padding: 10px 14px; margin-bottom: 6px; border: 1px solid #e0e0e0; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .history-track { font-size: 12px; color: #666; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
  .history-wh { font-size: 14px; font-weight: 600; color: #7c6ff7; white-space: nowrap; }
  .history-time { font-size: 11px; color: #bbb; white-space: nowrap; }

  .reset-wrap { margin: 0 16px 40px; }
  .btn-reset { width: 100%; background: #fff; color: #dc2626; border: 1px solid #fca5a5; border-radius: 8px; padding: 10px; font-size: 13px; cursor: pointer; }

  .unscanned-wrap { margin: 0 16px 16px; }
  .btn-unscanned { width: 100%; background: #fff; color: #7c6ff7; border: 1px solid #c4b5fd; border-radius: 8px; padding: 12px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .btn-unscanned:active { opacity: 0.85; }
  .unscanned-list { margin-top: 10px; background: #fff; border-radius: 10px; border: 1px solid #e0e0e0; max-height: 400px; overflow-y: auto; }
  .unscanned-item { padding: 10px 14px; border-bottom: 1px solid #f0f0f0; display: flex; justify-content: space-between; align-items: center; }
  .unscanned-item:last-child { border-bottom: none; }
  .unscanned-track { font-size: 13px; color: #1a1a1a; font-family: monospace; }
  .unscanned-wh { font-size: 13px; color: #7c6ff7; font-weight: 600; }

  .scan-overlay { display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.6); z-index:100; align-items:center; justify-content:center; padding:24px; }
  .scan-overlay.show { display:flex; }
  .overlay-card { background:#fff; border-radius:20px; padding:28px 24px; width:100%; max-width:360px; text-align:center; animation: popIn 0.2s ease; }
  @keyframes popIn { from { transform:scale(0.85); opacity:0; } to { transform:scale(1); opacity:1; } }
  .overlay-card.success-card { background:#f0fdf4; border: 2px solid #86efac; }
  .overlay-card.already-card { background:#fffbeb; border: 2px solid #fcd34d; }
  .overlay-card.error-card { background:#fef2f2; border: 2px solid #fca5a5; }
  .overlay-icon { font-size:48px; margin-bottom:12px; }
  .overlay-warehouse { font-size:36px; font-weight:800; color:#1a1a1a; margin-bottom:4px; }
  .overlay-track { font-size:12px; color:#aaa; margin-bottom:20px; word-break:break-all; }
  .overlay-ok { width:100%; background:#7c6ff7; color:#fff; border:none; border-radius:12px; padding:14px; font-size:16px; font-weight:700; cursor:pointer; }
  .overlay-ok:active { opacity:0.85; }
  .overlay-card.already-card .overlay-warehouse { color:#d97706; font-size:22px; }
  .overlay-card.already-card .overlay-ok { background:#f59e0b; }
  .overlay-card.error-card .overlay-warehouse { color:#dc2626; font-size:22px; }
  .overlay-card.error-card .overlay-ok { background:#ef4444; }
</style>

// Расстояние Левенштейна
function levenshtein(a, b) {
  const m = a.length, n = b.length;
  const dp = Array.from({length: m+1}, (_, i) => Array.from({length: n+1}, (_, j) => i === 0 ? j : j === 0 ? i : 0));
  for (let i = 1; i <= m; i++)
    for (let j = 1; j <= n; j++)
      dp[i][j] = a[i-1] === b[j-1] ? dp[i-1][j-1] : 1 + Math.min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]);
  return dp[m][n];
}

function lookup(trackCode) {
  const code = trackCode.trim();
  const isPartial = code.length <= 6;
  const codeLower = code.toLowerCase();

  // Шаг 1: точный поиск
  let allRows = TABLE.map((row, idx) => ({ idx, track: row[0], warehouse: row[1] }))
    .filter(r => isPartial ? r.track.toLowerCase().endsWith(codeLower) : r.track.toLowerCase() === codeLower);

  if (allRows.length === 0 && !isPartial) {
    // Шаг 2: поиск по последним 4 цифрам считанного кода
    const last4 = codeLower.slice(-4);
    const byLast4 = TABLE.map((row, idx) => ({ idx, track: row[0], warehouse: row[1] }))
      .filter(r => r.track.toLowerCase().endsWith(last4));

    if (byLast4.length === 1) {
      // Нашли ровно один — предлагаем как вариант
      const uniqueTracks = [...new Set(byLast4.map(r => r.track))];
      showResult('fuzzy', code, null, null, uniqueTracks, '🔍 Точный код не найден. Найден по последним 4 цифрам:');
      return;
    } else if (byLast4.length > 1) {
      const uniqueTracks = [...new Set(byLast4.map(r => r.track))];
      showResult('fuzzy', code, null, null, uniqueTracks, '🔍 Точный код не найден. Варианты по последним 4 цифрам:');
      return;
    }

    // Шаг 3: нечёткий поиск (Левенштейн, допуск до 3 символов)
    const fuzzy = TABLE.map((row, idx) => ({
      idx, track: row[0], warehouse: row[1],
      dist: levenshtein(codeLower, row[0].toLowerCase())
    })).filter(r => r.dist <= 3).sort((a, b) => a.dist - b.dist);

    if (fuzzy.length > 0) {
      const uniqueTracks = [...new Set(fuzzy.slice(0, 4).map(r => r.track))];
      showResult('fuzzy', code, null, null, uniqueTracks, '🔍 Точный код не найден. Похожие варианты:');
      return;
    }

    showResult('error', code, null, 'Трек-код не найден в списке');
    return;
  }

  if (allRows.length === 0) {
    showResult('error', code, null, `Трек с окончанием «${code}» не найден`);
    return;
  }

  // Частичный поиск нашёл несколько разных треков — показать выбор
  const uniqueTracks = [...new Set(allRows.map(r => r.track))];
  if (isPartial && uniqueTracks.length > 1) {
    showResult('multi', code, null, null, uniqueTracks);
    return;
  }

  const free = allRows.find(r => !scanned[r.idx]);

  if (!free) {
    const warehouses = [...new Set(allRows.map(r => r.warehouse))].join(', ');
    showResult('already', allRows[0].track, warehouses, null);
    return;
  }

  scanned[free.idx] = true;
  localStorage.setItem('scannedItems', JSON.stringify(scanned));

  const allWarehouses = [...new Set(allRows.map(r => r.warehouse))].join(' + ');
  showResult('success', allRows[0].track, allWarehouses, null);
  addHistory(allRows[0].track, free.warehouse);
  updateStats();
  beep();
  vibrate();
}

function showResult(type, track, warehouses, message, tracks, fuzzyMessage) {
  // Overlay for success, multi and fuzzy
  if (type === 'success' || type === 'multi' || type === 'fuzzy') {
    showOverlay(type, track, warehouses, tracks, fuzzyMessage);
  }
  const block = document.getElementById('resultBlock');
  if (type === 'success') {
    block.innerHTML = `<div class="result-card success">
      <div class="result-label">✅ Найдено и отмечено</div>
      <div class="result-track">${track}</div>
      <div class="result-warehouse">📦 ${warehouses}</div>
    </div>`;
  } else if (type === 'already') {
    block.innerHTML = `<div class="result-card already">
      <div class="result-label">⚠️ Уже отмечено</div>
      <div class="result-track">${track}</div>
      <div class="result-message">Склад: ${warehouses}</div>
    </div>`;
  } else if (type === 'multi') {
    const buttons = tracks.map(t =>
      `<button onclick="lookup('${t}')" style="display:block;width:100%;text-align:left;background:#fff;border:1px solid #e0e0e0;border-radius:8px;padding:10px 12px;margin-bottom:6px;font-size:13px;cursor:pointer;color:#1a1a1a;">${t}</button>`
    ).join('');
    block.innerHTML = `<div class="result-card already">
      <div class="result-label">🔍 Найдено несколько треков</div>
      <div class="result-message" style="margin-bottom:10px;">Выбери нужный:</div>
      ${buttons}
    </div>`;
  } else if (type === 'fuzzy') {
    const buttons = tracks.map(t =>
      `<button onclick="lookup('${t}')" style="display:block;width:100%;text-align:left;background:#fff;border:1px solid #7c6ff7;border-radius:8px;padding:10px 12px;margin-bottom:6px;font-size:13px;cursor:pointer;color:#1a1a1a;">${t}</button>`
    ).join('');
    block.innerHTML = `<div class="result-card already" style="border-color:#a5b4fc;background:#f5f3ff;">
      <div class="result-label" style="color:#6d28d9;">${fuzzyMessage || ''}</div>
      <div class="result-track" style="margin-bottom:10px;">Считано: ${track}</div>
      ${buttons}
    </div>`;
    block.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  } else {
    block.innerHTML = `<div class="result-card error">
      <div class="result-label">❌ Не найдено</div>
      <div class="result-track">${track}</div>
      <div class="result-message">${message}</div>
    </div>`;
  }
  block.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function updateStats() {
  const total = TABLE.length;
  const done = Object.keys(scanned).length;
  document.getElementById('statScanned').textContent = done;
  document.getElementById('statTotal').textContent = total;
  const pct = total > 0 ? Math.round(done / total * 100) : 0;
  document.getElementById('progressBar').style.width = pct + '%';
  updateUnscannedCount();
}

function addHistory(track, warehouse) {
  const now = new Date();
  const time = now.getHours() + ':' + String(now.getMinutes()).padStart(2,'0');
  scanHistory.unshift({ track, warehouse, time });
  if (scanHistory.length > 30) scanHistory = scanHistory.slice(0, 30);
  localStorage.setItem('scanHistory', JSON.stringify(scanHistory));
  renderHistory();
}

function renderHistory() {
  if (scanHistory.length === 0) return;
  document.getElementById('historySection').style.display = 'block';
  document.getElementById('historyList').innerHTML = scanHistory.slice(0, 15).map(h => `
    <div class="history-item">
      <span class="history-track">${h.track}</span>
      <span class="history-wh">${h.warehouse}</span>
      <span class="history-time">${h.time}</span>
    </div>`).join('');
}

function clearHistory() {
  if (!confirm('Очистить историю?')) return;
  scanHistory = [];
  localStorage.removeItem('scanHistory');
  document.getElementById('historySection').style.display = 'none';
}

function toggleUnscanned() {
  const list = document.getElementById('unscannedList');
  if (list.style.display === 'none') {
    showUnscanned();
    list.style.display = 'block';
  } else {
    list.style.display = 'none';
  }
}

function showUnscanned() {
  const remaining = TABLE
    .map((row, idx) => ({ idx, track: row[0], warehouse: row[1] }))
    .filter(r => !scanned[r.idx]);

  const list = document.getElementById('unscannedList');
  if (remaining.length === 0) {
    list.innerHTML = '<div style="padding:16px;text-align:center;color:#999;font-size:13px;">Все отсканировано! 🎉</div>';
  } else {
    list.innerHTML = remaining.map(r =>
      `<div class="unscanned-item">
        <span class="unscanned-track">${r.track}</span>
        <span class="unscanned-wh">${r.warehouse}</span>
      </div>`
    ).join('');
  }
}

function updateUnscannedCount() {
  const remaining = TABLE.length - Object.keys(scanned).length;
  document.getElementById('unscannedCount').textContent = remaining;
}

function resetAll() {
  if (!confirm('Сбросить все отметки? Это действие нельзя отменить.')) return;
  scanned = {};
  scanHistory = [];
  localStorage.removeItem('scannedItems');
  localStorage.removeItem('scanHistory');
  document.getElementById('historySection').style.display = 'none';
  document.getElementById('resultBlock').innerHTML = '';
  updateStats();
}

function exportScanned() {
  const rows = TABLE
    .map((row, idx) => ({ track: row[0], warehouse: row[1], done: !!scanned[idx] }))
    .filter(r => r.done)
    .map(r => r.track + ',' + r.warehouse)
    .join('\n');
  const text = 'Трек код,Склад\n' + (rows || '');
  const blob = new Blob(['\uFEFF' + text], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'отсканированные.csv';
  a.click();
}

function manualSearch() {
  const val = document.getElementById('manualInput').value.trim();
  if (!val) return;
  lookup(val);
  document.getElementById('manualInput').value = '';
}

document.getElementById('manualInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') manualSearch();
});

function toggleScanner() {
  scanning ? stopScanner() : startScanner();
}

let allCameras = [];
let activeCameraId = null;

async function startScanner() {
  document.getElementById('reader').style.display = 'block';
  document.getElementById('zoomSection').style.display = 'block';
  document.getElementById('scanBtn').textContent = '⏹ Остановить сканер';
  document.getElementById('scanBtn').classList.add('stop');
  scanning = true;
  document.getElementById('zoomSlider').value = 1.5;
  document.getElementById('zoomVal').textContent = '1.5x';

  // Получаем список камер
  try {
    allCameras = await Html5Qrcode.getCameras();
  } catch(e) { allCameras = []; }

  // Строим кнопки камер
  const btnContainer = document.getElementById('cameraButtons');
  btnContainer.innerHTML = '';

  // Показываем ВСЕ камеры — пользователь сам выберет лучшую
  // Исключаем только фронтальную
  const backCams = allCameras.filter(d => {
    const l = d.label.toLowerCase();
    return !l.includes('front') && !l.includes('face');
  });

  // Если фильтр убрал всё — показываем все
  const camsToShow = backCams.length > 0 ? backCams : allCameras;

  // Даём короткие имена
  const namedCams = camsToShow.map((cam, i) => {
    const l = cam.label.toLowerCase();
    let name = '' + (i + 1);
    if (l.includes('ultra') && l.includes('wide')) name = '0.5x';
    else if (l.includes('telephoto') || l.includes('tele')) name = '3x';
    else if (l.includes('wide') && !l.includes('ultra')) name = '1x';
    return { ...cam, displayName: name };
  });

  allCameras = namedCams;

  if (allCameras.length > 1) {
    // Прокручиваемый контейнер
    btnContainer.style.overflowX = 'auto';
    btnContainer.style.flexWrap = 'nowrap';
    allCameras.forEach((cam, i) => {
      const btn = document.createElement('button');
      btn.id = 'camBtn' + i;
      btn.textContent = cam.displayName;
      btn.style.cssText = 'min-width:50px;flex-shrink:0;border:1.5px solid #e0e0e0;background:#f5f5f5;border-radius:8px;padding:10px 12px;font-size:14px;font-weight:700;cursor:pointer;color:#555;';
      btn.onclick = () => switchCamera(cam.id, i);
      btnContainer.appendChild(btn);
    });
  } else {
    btnContainer.style.display = 'none';
  }

  // Выбираем камеру "1x" по умолчанию, или первую
  const mainWide = allCameras.find(d => d.displayName === '1x');
  const defaultCam = mainWide || allCameras[0];
  const defaultId = defaultCam?.id || null;

  await startWithCamera(defaultId);

  // Подсветим активную кнопку
  const idx = allCameras.findIndex(c => c.id === defaultId);
  highlightCamBtn(idx);
}

async function switchCamera(camId, btnIdx) {
  if (activeCameraId === camId) return;
  // Остановим текущий сканер
  if (scanner) {
    try { await scanner.stop(); } catch(e) {}
    scanner = null;
  }
  await startWithCamera(camId);
  highlightCamBtn(btnIdx);
}

function highlightCamBtn(activeIdx) {
  allCameras.forEach((_, i) => {
    const btn = document.getElementById('camBtn' + i);
    if (!btn) return;
    if (i === activeIdx) {
      btn.style.background = '#7c6ff7';
      btn.style.color = '#fff';
      btn.style.borderColor = '#7c6ff7';
    } else {
      btn.style.background = '#f5f5f5';
      btn.style.color = '#555';
      btn.style.borderColor = '#e0e0e0';
    }
  });
}

async function startWithCamera(camId) {
  activeCameraId = camId;
  scanner = new Html5Qrcode("reader");

  const constraint = camId
    ? { deviceId: { exact: camId } }
    : { facingMode: "environment" };

  try {
    await scanner.start(
      constraint,
      {
        fps: 30,
        disableFlip: true,
        formatsToSupport: [
          Html5QrcodeSupportedFormats.CODE_128,
          Html5QrcodeSupportedFormats.CODE_39,
          Html5QrcodeSupportedFormats.CODE_93,
          Html5QrcodeSupportedFormats.ITF
        ]
      },
      (code) => { lookup(code.trim()); },
      () => {}
    );
    setTimeout(() => setZoom(parseFloat(document.getElementById('zoomSlider').value)), 500);
  } catch(e) {
    showResult('error', '', null, 'Нет доступа к камере. Разреши доступ в настройках браузера.');
    stopScanner();
  }
}

function setZoom(val) {
  document.getElementById('zoomVal').textContent = val + 'x';
  if (!scanner) return;
  try {
    const track = scanner.getRunningTrackCameraCapabilities();
    if (track && track.zoomFeature().isSupported()) {
      track.zoomFeature().apply(parseFloat(val));
    }
  } catch(e) {}
}

function stopScanner() {
  if (scanner) { scanner.stop().catch(() => {}); scanner = null; }
  document.getElementById('reader').style.display = 'none';
  document.getElementById('zoomSection').style.display = 'none';
  document.getElementById('zoomSlider').value = 1;
  document.getElementById('zoomVal').textContent = '1x';
  document.getElementById('scanBtn').textContent = '📷 Сканировать штрих-код';
  document.getElementById('scanBtn').classList.remove('stop');
  scanning = false;
}

function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.connect(g);
    g.connect(ctx.destination);
    o.frequency.value = 1800;
    o.type = 'sine';
    g.gain.setValueAtTime(0.3, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
    o.start(ctx.currentTime);
    o.stop(ctx.currentTime + 0.15);
  } catch(e) {}
}

function vibrate() {
  if (navigator.vibrate) navigator.vibrate(100);
}

function showOverlay(type, track, warehouses, tracks, fuzzyMessage) {
  // Pause scanner while overlay is open
  if (scanner) scanner.pause(true);
  const overlay = document.getElementById('scanOverlay');
  const card = document.getElementById('overlayCard');
  const icon = document.getElementById('overlayIcon');
  const wh = document.getElementById('overlayWarehouse');
  const tr = document.getElementById('overlayTrack');

  card.className = 'overlay-card';
  wh.style.color = '';
  wh.style.fontSize = '';
  if (type === 'success') {
    card.className = 'overlay-card success-card';
    icon.textContent = '✅';
    tr.textContent = track;
    // Multi-recipient: split by " и " and show each on new line
    const existingWarn = card.querySelector('.multi-warn');
    if (existingWarn) existingWarn.remove();
    if (warehouses.includes(' и ')) {
      const recipients = warehouses.split(' и ').map(r => r.trim());
      wh.innerHTML = recipients.map(r => '📦 ' + r).join('<br>');
      wh.style.fontSize = '26px';
      const warn = document.createElement('div');
      warn.className = 'multi-warn';
      warn.textContent = '⚠️ Товаров может быть несколько!';
      warn.style.cssText = 'background:#fff7ed;border:1px solid #fed7aa;border-radius:8px;padding:10px 12px;font-size:14px;font-weight:600;color:#ea580c;margin:8px 0 16px;';
      card.insertBefore(warn, card.querySelector('.overlay-ok'));
    } else {
      wh.textContent = '📦 ' + warehouses;
      wh.style.fontSize = '';
    }
  } else if (type === 'already') {
    card.className = 'overlay-card already-card';
    icon.textContent = '⚠️';
    wh.textContent = 'Уже отмечено: ' + warehouses;
    tr.textContent = track;
  } else if (type === 'fuzzy') {
    card.className = 'overlay-card';
    card.style.border = '2px solid #a5b4fc';
    card.style.background = '#f5f3ff';
    icon.textContent = '🔍';
    wh.innerHTML = fuzzyMessage || 'Похожие варианты';
    wh.style.color = '#6d28d9';
    wh.style.fontSize = '16px';
    tr.textContent = 'Считано: ' + track;
    const existing = card.querySelector('.multi-btns');
    if (existing) existing.remove();
    const div = document.createElement('div');
    div.className = 'multi-btns';
    div.style.marginBottom = '12px';
    tracks.forEach(t => {
      const b = document.createElement('button');
      b.textContent = t;
      b.style.cssText = 'display:block;width:100%;text-align:left;background:#fff;border:1px solid #7c6ff7;border-radius:8px;padding:10px 12px;margin-bottom:6px;font-size:14px;cursor:pointer;font-weight:600;';
      b.onclick = () => { overlayOk(); lookup(t); };
      div.appendChild(b);
    });
    card.insertBefore(div, card.querySelector('.overlay-ok'));
  } else if (type === 'multi') {
    icon.textContent = '🔍';
    wh.textContent = 'Найдено несколько';
    wh.style.color = '#7c6ff7';
    wh.style.fontSize = '22px';
    tr.textContent = 'Выбери трек:';
    // inject buttons
    const existing = card.querySelector('.multi-btns');
    if (existing) existing.remove();
    const div = document.createElement('div');
    div.className = 'multi-btns';
    div.style.marginBottom = '12px';
    tracks.forEach(t => {
      const b = document.createElement('button');
      b.textContent = t;
      b.style.cssText = 'display:block;width:100%;text-align:left;background:#f5f5f5;border:1px solid #e0e0e0;border-radius:8px;padding:10px 12px;margin-bottom:6px;font-size:13px;cursor:pointer;';
      b.onclick = () => { overlayOk(); lookup(t); };
      div.appendChild(b);
    });
    card.insertBefore(div, card.querySelector('.overlay-ok'));
  }
  overlay.classList.add('show');
}

function overlayOk() {
  document.getElementById('scanOverlay').classList.remove('show');
  const mb = document.querySelector('.multi-btns');
  if (mb) mb.remove();
  const mw = document.querySelector('.multi-warn');
  if (mw) mw.remove();
  // Resume scanner
  if (scanner) {
    try { scanner.resume(); } catch(e) {}
  }
}
</script>
