<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Инструкция Piksta — скоро появится</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/x-icon" href="/favicon.ico?v=5">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
:root{--ink:#17142a;--mut:#5f5a74;--acc:#6C4DB8;--soft:#f0ecf9}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;font-family:Inter,"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;color:var(--ink);background:#fbfaf7;line-height:1.55}
.card{max-width:460px;width:100%;background:#fff;border:1px solid #ece9f3;border-radius:22px;padding:34px 28px;text-align:center;box-shadow:0 10px 40px rgba(60,40,120,.07)}
.lg{display:inline-flex;align-items:center;gap:9px;font-weight:800;color:var(--acc);font-size:18px;text-decoration:none}
.lg img{width:34px;height:34px;border-radius:9px}
.ic{width:64px;height:64px;border-radius:20px;background:var(--soft);color:var(--acc);display:flex;align-items:center;justify-content:center;font-size:32px;margin:26px auto 16px}
h1{font-size:24px;margin:0 0 8px;letter-spacing:-.01em}
p{margin:0 auto;color:var(--mut);font-size:15.5px;max-width:360px}
.bt{display:flex;flex-direction:column;gap:10px;margin-top:24px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--acc);color:#fff;border-radius:12px;padding:12px 16px;font-weight:600;font-size:15px;text-decoration:none}
.btn.gh{background:#fff;color:var(--acc);border:1.5px solid #ddd5f3}
</style>
</head>
<body>
<main class="card">
  <a class="lg" href="/"><img src="/icons/icon-72x72.png" alt="">Piksta</a>
  <div class="ic"><i class="ti ti-book"></i></div>
  <h1>Инструкция скоро появится</h1>
  <p>Мы обновляем инструкцию под новые функции Piksta. Если что-то непонятно — напишите в поддержку, подскажем.</p>
  <div class="bt">
    <a class="btn" href="/app"><i class="ti ti-arrow-left"></i>Вернуться в Piksta</a>
    <a class="btn gh" href="https://t.me/piksta_support_bot" target="_blank" rel="noopener"><i class="ti ti-brand-telegram"></i>Написать в поддержку</a>
  </div>
</main>
</body>
</html>
